name: F&O High-Frequency Intraday Scan

on:
  schedule:
    # 03:45 UTC (09:15 IST) opening scan
    - cron: '45 3 * * 1-5'
    # Every 3 minutes from 04:00 to 06:30 UTC (09:30 to 12:00 IST) — PEAK hours: max volume/volatility
    - cron: '*/3 4-6 * * 1-5'
    # Every 5 minutes from 06:30 to 08:00 UTC (12:00 to 13:30 IST) — off-peak hours
    - cron: '*/5 7-8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run F&O High-Frequency Scan Pipeline
        run: python main.py
        env:
          MEGABULL_API_KEY: ${{ secrets.MEGABULL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEGABULL_MOCK: "${{ secrets.MEGABULL_MOCK || 'true' }}"

      - name: Commit and push state changes
        run: |
          git config --global user.email "bot@alphadesk.io"
          git config --global user.name "AlphaDesk F&O Bot"
          git add state/ dashboard/state/
          git diff --quiet && git diff --staged --quiet || (git commit -m "state: f&o scan updates ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" && git pull --rebase origin main && git push origin main)
