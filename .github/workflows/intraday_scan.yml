name: F&O High-Frequency Intraday Scan

on:
  schedule:
    # 03:48 UTC (09:18 IST) opening scan
    - cron: '48 3 * * 1-5'
    # Regular scans every 15 minutes from 09:33 to 14:18 IST (04:03 to 08:48 UTC)
    - cron: '3,18,33,48 4-8 * * 1-5'
    # Afternoon session scans at 14:33 and 14:48 IST (09:03 and 09:18 UTC)
    - cron: '3,18 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run F&O High-Frequency Scan Pipeline
        run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push state changes
        run: |
          git config --global user.email "bot@alphadesk.io"
          git config --global user.name "AlphaDesk F&O Bot"
          git add state/ dashboard/state/ public/state/
          git diff --quiet && git diff --staged --quiet || (git commit -m "state: f&o scan updates ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" && git pull -s recursive -X ours --no-edit origin main && git push origin main)
