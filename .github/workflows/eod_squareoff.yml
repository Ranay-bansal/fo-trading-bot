name: F&O EOD Square-off

on:
  schedule:
    # Single authoritative run at 09:40 UTC (15:10 IST) to execute pre-CAS square-off
    - cron: '40 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run F&O EOD Square-off
        run: python main.py
        env:
          MEGABULL_API_KEY: ${{ secrets.MEGABULL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEGABULL_MOCK: "${{ secrets.MEGABULL_MOCK || 'true' }}"

      - name: Commit and push state changes
        run: |
          git config --global user.email "bot@alphadesk.io"
          git config --global user.name "AlphaDesk F&O Bot"
          git add state/ dashboard/state/ public/state/
          git diff --quiet && git diff --staged --quiet || (git commit -m "state: f&o eod squareoff ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" && git pull -s recursive -X ours --no-edit origin main && git push origin main)
